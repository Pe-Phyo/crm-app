<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Meetings</title>
    <link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Meetings</h1>
            <div>
                <button id="addBtn" class="btn btn-primary">➕ Add</button>
                <button id="resetBtn" class="btn btn-secondary">↻ Reset</button>
                <button id="backBtn" class="btn btn-secondary">← Back</button>
            </div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- ADD MODAL -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2>➕ Add Meeting</h2>
            <label>Name</label>
            <input type="text" id="addName" placeholder="Math Group A">
            <label>Day</label>
            <select id="addDay">
                <option>Sunday</option><option>Monday</option><option>Tuesday</option>
                <option>Wednesday</option><option>Thursday</option><option>Friday</option>
                <option>Saturday</option>
            </select>
            <label>Time</label>
            <input type="time" id="addTime" value="09:00">
            <label>Type</label>
            <select id="addType">
                <option value="private">Private</option>
                <option value="group" selected>Group</option>
            </select>
            <label>Students</label>
            <input type="text" id="addStudentInput" placeholder="Type name, press Enter">
            <div id="addStudentList" class="student-list"></div>
            <label>Jitsi Link</label>
            <input type="text" id="addLink" placeholder="https://meet.jit.si/room">
            <label>Rate (MMK)</label>
            <input type="number" id="addRate" placeholder="25000">
            <label>Homework</label>
            <input type="text" id="addHomework" placeholder="Chapter 3 exercises">
            <label>Comments for Next Lesson</label>
            <textarea id="addComments" rows="2" placeholder="Review past tense, practice speaking"></textarea>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="addCancelBtn">Cancel</button>
                <button class="btn btn-success" id="addSubmitBtn">Add</button>
            </div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2>✏️ Edit</h2>
            <input type="hidden" id="editId">
            <label>Name</label>
            <input type="text" id="editName">
            <label>Day</label>
            <select id="editDay">
                <option>Sunday</option><option>Monday</option><option>Tuesday</option>
                <option>Wednesday</option><option>Thursday</option><option>Friday</option>
                <option>Saturday</option>
            </select>
            <label>Time</label>
            <input type="time" id="editTime">
            <label>Type</label>
            <select id="editType">
                <option value="private">Private</option>
                <option value="group">Group</option>
            </select>
            <label>Students</label>
            <input type="text" id="editStudentInput" placeholder="Type name, press Enter">
            <div id="editStudentList" class="student-list"></div>
            <label>Link</label>
            <input type="text" id="editLink">
            <label>Rate (MMK)</label>
            <input type="number" id="editRate" placeholder="25000">
            <label>Homework</label>
            <input type="text" id="editHomework" placeholder="Chapter 3 exercises">
            <label>Comments for Next Lesson</label>
            <textarea id="editComments" rows="2" placeholder="Review past tense, practice speaking"></textarea>
            <label>Attendance</label>
            <div id="editAttendanceList" class="student-list"></div>
            <div class="attendance-controls">
                <button class="btn btn-secondary" id="markAllBtn">Mark All</button>
                <button class="btn btn-secondary" id="unmarkAllBtn">Unmark All</button>
            </div>
            <div class="modal-actions" style="justify-content:space-between;">
                <button class="btn btn-danger" id="editDeleteBtn">Delete</button>
                <div>
                    <button class="btn btn-secondary" id="editCancelBtn">Cancel</button>
                    <button class="btn btn-success" id="editSaveBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
