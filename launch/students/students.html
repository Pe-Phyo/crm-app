<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Students</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Students</h1>
            <div>
                <button id="backBtn" class="btn btn-secondary">Back</button>
            </div>
        </div>

        <!-- Main dashboard -->
        <div id="mainPanel" style="display:none;">
            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="Search by name...">
                <select id="statusFilter">
                    <option value="">All Status</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
                <select id="paymentFilter">
                    <option value="">Payment Status</option>
                    <option value="paid">Paid this month</option>
                    <option value="overdue">Overdue</option>
                </select>
                <input type="number" id="rateMin" placeholder="Rate min" style="width:80px;">
                <input type="number" id="rateMax" placeholder="Rate max" style="width:80px;">
                <button id="applyFiltersBtn" class="btn btn-secondary">Filter</button>
            </div>

            <div class="panel-layout">
                <div class="main-panel">
                    <div class="panel-header">
                        <h3>Active Students</h3>
                        <button id="addStudentBtn" class="btn btn-primary">+ Add Student</button>
                    </div>
                    <div id="studentList"></div>
                </div>
                <div class="side-panel">
                    <h3>Action Items</h3>
                    <div id="actionItems"></div>
                    <h3 style="margin-top:20px;">Available Slots</h3>
                    <div class="placeholder-box">Coming soon</div>
                    <h3 style="margin-top:20px;">Telegram</h3>
                    <div class="placeholder-box">Coming soon</div>
                </div>
            </div>
        </div>

        <!-- Add/Edit Student Modal -->
        <div class="modal-overlay" id="studentModal">
            <div class="modal" style="max-width:700px;max-height:90vh;overflow-y:auto;">
                <h2 id="modalTitle">Add Student</h2>
                <form id="studentForm">
                    <input type="hidden" id="studentUuid">

                    <!-- Section 1+2: Profile & Contacts -->
                    <fieldset class="form-section">
                        <legend>Profile</legend>
                        <label>Full Name *</label>
                        <input type="text" name="name" required>

                        <label>Birthdate</label>
                        <input type="date" name="birthdate">

                        <label>Age Group *</label>
                        <select name="age_group" id="ageGroupSelect">
                            <option value="Adult">Adult</option>
                            <option value="Young Adult">Young Adult</option>
                            <option value="Child">Child</option>
                        </select>

                        <label>Location / Timezone</label>
                        <select name="timezone" id="timezoneSelect">
                            <option value="">-- Select --</option>
                        </select>

                        <label>Teacher *</label>
                        <select name="teacher_id" id="teacherSelect" required>
                            <option value="">-- Select --</option>
                        </select>

                        <label>Phone Numbers</label>
                        <div id="phoneNumbersContainer">
                            <div class="multi-input-row">
                                <input type="text" class="phone-input" placeholder="+95 9 123 456 789">
                                <button type="button" class="add-multi-btn">+</button>
                            </div>
                        </div>

                        <label>Email Addresses</label>
                        <div id="emailsContainer">
                            <div class="multi-input-row">
                                <input type="email" class="email-input" placeholder="student@example.com">
                                <button type="button" class="add-multi-btn">+</button>
                            </div>
                        </div>

                        <label>Telegram</label>
                        <input type="text" name="telegram" placeholder="@username">
                    </fieldset>

                    <!-- 2a: Minor Info (hidden by default) -->
                    <fieldset class="form-section" id="minorInfoSection" style="display:none;">
                        <legend>Guardian & School</legend>
                        <label>Parent/Guardian Name *</label>
                        <input type="text" name="parent_name">

                        <label>Parent Phone</label>
                        <div id="parentPhonesContainer">
                            <div class="multi-input-row">
                                <input type="text" class="parent-phone-input" placeholder="+95 9 987 654 321">
                                <button type="button" class="add-multi-btn">+</button>
                            </div>
                        </div>

                        <label>Parent Email</label>
                        <div id="parentEmailsContainer">
                            <div class="multi-input-row">
                                <input type="email" class="parent-email-input" placeholder="parent@example.com">
                                <button type="button" class="add-multi-btn">+</button>
                            </div>
                        </div>

                        <label>School Name</label>
                        <input type="text" name="school_name">

                        <label>Grade / Academic Year</label>
                        <input type="text" name="academic_year">
                    </fieldset>

                    <!-- 2b: Linked Students -->
                    <fieldset class="form-section">
                        <legend>Linked Students (Family/Siblings)</legend>
                        <div id="linkedStudentsList"></div>
                        <div class="link-student-row">
                            <select id="linkStudentSelect">
                                <option value="">-- Select student --</option>
                            </select>
                            <select id="relationshipType">
                                <option value="Parent">Parent</option>
                                <option value="Child">Child</option>
                                <option value="Sibling">Sibling</option>
                                <option value="Spouse">Spouse</option>
                                <option value="Other">Other</option>
                            </select>
                            <label style="display:flex;align-items:center;font-size:12px;">
                                <input type="checkbox" id="invoiceGroupCheck"> Group for invoicing
                            </label>
                            <button type="button" id="addLinkBtn" class="btn btn-secondary">Link</button>
                        </div>
                    </fieldset>

                    <!-- Section 3: Rate -->
                    <fieldset class="form-section">
                        <legend>Rate</legend>
                        <label>Rate per lesson (MMK) *</label>
                        <input type="number" name="rate" required>
                    </fieldset>

                    <!-- Section 4: Meeting Times -->
                    <fieldset class="form-section">
                        <legend>Meeting Times</legend>
                        <div id="meetingTimesList"></div>

                        <div id="groupMeetingContainer"></div>  <!-- group dropdown inserted here -->

                        <label>Meeting Name</label>
                        <input type="text" id="meetingName" placeholder="e.g., Math Group A">

                        <label>Day</label>
                        <select id="meetingDay">
                            <option>Sunday</option><option>Monday</option><option>Tuesday</option>
                            <option>Wednesday</option><option>Thursday</option><option>Friday</option>
                            <option>Saturday</option>
                        </select>

                        <label>Time</label>
                        <input type="time" id="meetingTime" value="09:00">

                        <label>Type</label>
                        <select id="meetingType">
                            <option value="private">Private</option>
                            <option value="group">Group</option>
                        </select>

                        <label>In‑person</label>
                        <input type="checkbox" id="meetingInPerson" style="width:auto;">

                        <label>Meeting Link</label>
                        <input type="text" id="meetingLink" placeholder="Will auto‑fill based on name" style="margin-bottom:10px;">

                        <button type="button" id="addMeetingBtn" class="btn btn-primary">+ Add Meeting</button>
                    </fieldset>

                    <!-- Section 6: Goals & Notes -->
                    <fieldset class="form-section">
                        <legend>Goals & Notes</legend>
                        <label>Educational Goals</label>
                        <textarea name="educational_goals" rows="3"></textarea>
                        <label>General Comments</label>
                        <textarea name="general_comments" rows="3"></textarea>
                    </fieldset>

                    <div class="modal-actions" style="margin-top:20px;">
                        <button type="button" class="btn btn-secondary" id="modalCancelBtn">Cancel</button>
                        <button type="submit" class="btn btn-success">Save Student</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Student Detail Modal -->
        <div class="modal-overlay" id="detailModal">
            <div class="modal" style="max-width:700px;max-height:90vh;overflow-y:auto;">
                <div id="detailContent"></div>
                <button id="closeDetailBtn" class="btn btn-secondary" style="margin-top:15px;">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
