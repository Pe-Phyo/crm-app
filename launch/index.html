<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM App – Login</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --card-bg: #181825;
            --primary: #89b4fa;
            --danger: #f38ba8;
            --text: #cdd6f4;
            --muted: #6c7086;
            --border: #313244;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            width: 320px;
            text-align: center;
        }
        .login-box h1 {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: normal;
            margin-bottom: 1.5rem;
        }
        .login-box h1::before {
            content: '❯ ';
            color: #a6e3a1;
        }
        .login-box input {
            width: 100%;
            padding: 0.6rem;
            margin-bottom: 0.8rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
        }
        .login-box input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .login-box button {
            width: 100%;
            padding: 0.6rem;
            background: var(--primary);
            color: #1e1e2e;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        .login-box button:hover {
            background: #74c7ec;
        }
        .error {
            color: var(--danger);
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        .forgot {
            color: var(--muted);
            font-size: 0.7rem;
            margin-top: 1rem;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>CRM App</h1>
        <form id="login-form">
            <input type="text" id="username" placeholder="Username" required autocomplete="username">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit">Log In</button>
        </form>
        <p class="error" id="login-error"></p>
        <p class="forgot" id="forgot-password">Forgot password?</p>
    </div>
    <script type="module">
        import { login } from './dashboard/js/api.js';

        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('login-error');
        const forgotEl = document.getElementById('forgot-password');

        // Auto-redirect if already logged in
        if (localStorage.getItem('staff_token')) {
            window.location.href = '/launch/dashboard/dashboard.html';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const data = await login(username, password);
                localStorage.setItem('staff_token', data.token);
                localStorage.setItem('staff_role', data.role);
                localStorage.setItem('staff_uuid', data.uuid);
                window.location.href = '/launch/dashboard/dashboard.html';
            } catch (err) {
                errorEl.textContent = err.message;
            }
        });

        forgotEl.addEventListener('click', () => {
            alert('Please contact the administrator to reset your password.\nA request will be sent to the Dev dashboard.');
            // Future: POST /api/dashboard/forgot-password
        });
    </script>
</body>
</html>
