<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM App – Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-box">
        <h1>CRM App</h1>
        <form id="login-form">
            <input type="text" id="username" placeholder="Username" required autocomplete="username">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit" class="btn btn-primary">Log In</button>
        </form>
        <p class="error" id="login-error"></p>
        <p class="forgot" id="forgot-password">Forgot password?</p>
    </div>
    <script type="module">
        import { login } from './dashboard/js/api.js';

        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('login-error');
        const forgotEl = document.getElementById('forgot-password');

        // Auto-redirect if already logged in
        if (localStorage.getItem('staff_token')) {
            window.location.href = '/launch/dashboard/dashboard.html';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const data = await login(username, password);
                localStorage.setItem('staff_token', data.token);
                localStorage.setItem('staff_role', data.role);
                localStorage.setItem('staff_uuid', data.uuid);
                window.location.href = '/launch/dashboard/dashboard.html';
            } catch (err) {
                errorEl.textContent = err.message;
            }
        });

        forgotEl.addEventListener('click', () => {
            alert('Please contact the administrator to reset your password.\nA request will be sent to the Dev dashboard.');
        });
    </script>
</body>
</html>
