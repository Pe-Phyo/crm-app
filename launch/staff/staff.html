<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff</title>
    <link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="pageTitle">Staff</h1>
            <div>
                <button id="addStaffBtn" class="btn btn-primary" style="display:none;">+ Add Staff</button>
                <button id="backBtn" class="btn btn-secondary">← Back</button>
            </div>
        </div>

        <!-- Personal Profile Mode -->
        <div id="ownProfile" style="display:none;"></div>

        <!-- Management Mode (admin/back-office) -->
        <div id="managementView" style="display:none;">
            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="Search by name...">
                <select id="roleFilter">
                    <option value="">All Roles</option>
                    <option value="admin">Admin</option>
                    <option value="teacher">Teacher</option>
                    <option value="front_office">Front Office</option>
                    <option value="back_office">Back Office</option>
                    <option value="bot">Bot</option>
                    <option value="dev">Dev</option>
                </select>
                <button id="applyFiltersBtn" class="btn btn-secondary">Filter</button>
            </div>
            <div id="staffList"></div>
        </div>

        <!-- Detail/Edit Modal -->
        <div class="modal-overlay" id="detailModal">
            <div class="modal" style="max-width:700px;max-height:90vh;overflow-y:auto;">
                <div id="detailContent"></div>
                <button id="closeDetailBtn" class="btn btn-secondary" style="margin-top:15px;">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
